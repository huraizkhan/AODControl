name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable signing key
        env:
          AOD_KEYSTORE_BASE64: ${{ secrets.AOD_KEYSTORE_BASE64 }}
        run: |
          test -n "$AOD_KEYSTORE_BASE64" || { echo "Missing AOD_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$AOD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aodcontrol-release.jks"

      - name: Build signed release APK
        env:
          AOD_KEYSTORE_FILE: ${{ runner.temp }}/aodcontrol-release.jks
          AOD_KEYSTORE_PASSWORD: ${{ secrets.AOD_KEYSTORE_PASSWORD }}
          AOD_KEY_ALIAS: ${{ secrets.AOD_KEY_ALIAS }}
          AOD_KEY_PASSWORD: ${{ secrets.AOD_KEY_PASSWORD }}
        run: |
          test -n "$AOD_KEYSTORE_PASSWORD" || { echo "Missing AOD_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$AOD_KEY_ALIAS" || { echo "Missing AOD_KEY_ALIAS secret"; exit 1; }
          test -n "$AOD_KEY_PASSWORD" || { echo "Missing AOD_KEY_PASSWORD secret"; exit 1; }
          gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AODControl-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
